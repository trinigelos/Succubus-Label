name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Set these in Settings → Secrets and variables → Actions.
          # NEXT_PUBLIC_* values end up in the public JS bundle — that's
          # expected (RLS in Postgres is the real protection, see
          # supabase/migrations), never put a service role key here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_IBAN: ${{ secrets.NEXT_PUBLIC_IBAN }}
          NEXT_PUBLIC_IBAN_HOLDER: ${{ secrets.NEXT_PUBLIC_IBAN_HOLDER }}
          # Leave empty for a custom domain or a username.github.io repo;
          # set to "/repo-name" for a project page (username.github.io/repo-name).
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          SHOP_URL: ${{ vars.SHOP_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
